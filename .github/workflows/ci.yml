name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: pip install -e ".[dev]"

      - name: Run tests
        run: pytest

      - name: Validate cases
        run: python -m guardscore validate

      - name: Run the baseline guards
        run: >
          python -m guardscore run
          --guard builtin:allow-all
          --guard builtin:block-all
          --guard builtin:coin-flip
          --guard builtin:naive-patterns
