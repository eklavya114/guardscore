[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "guardscore"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest"]

[project.scripts]
guardscore = "guardscore.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["src/guardscore"]
